/* 코스 링크 페이지에만 쓰는 몇 줄. 나머지는 site.css의 .doc·.stores를 그대로 쓴다. */
.course__map { margin: 8px 0 0; background: var(--white); border-radius: var(--r); box-shadow: 0 0 0 1px var(--line); line-height: 0; }
.course__map svg { width: 100%; height: auto; display: block; }
.course__line { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.course__start { fill: var(--lime); stroke: var(--ink); stroke-width: 3; }
.course__end { fill: var(--ink); }
.course__key { display: flex; gap: 16px; margin: 10px 0 0; font-size: 14px; color: var(--mute); }
.course__key i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.course__key .s { background: var(--lime); box-shadow: 0 0 0 2px var(--ink) inset; }
.course__key .e { background: var(--ink); }
.course__open { display: inline-block; margin-top: 28px; text-decoration: none; font-size: 17px; font-weight: 800; background: var(--ink); color: var(--lime); padding: 14px 24px; border-radius: 99px; }
.doc a.course__open { color: var(--lime); text-decoration: none; }
.doc .course__rec { list-style: none; padding: 0; margin: 12px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.course__rec li { margin: 0; background: var(--white); border-radius: 14px; padding: 10px 12px; box-shadow: 0 0 0 1px var(--line); font-variant-numeric: tabular-nums; }
.course__rec b { display: block; font-size: 13px; color: var(--mute); font-weight: 600; }
.doc .course__langs { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 40px; padding: 0; list-style: none; font-size: 14px; }
.course__langs button { font: inherit; background: none; border: 0; padding: 0; color: var(--mute); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.course__langs button[aria-current="true"] { color: var(--ink); font-weight: 700; text-decoration: none; }
</style>

<!-- 앱이 만드는 코스 링크(course.html#<조각>)를 여는 페이지. 빌드와 상관없는 손으로 쓴 파일이다.
     조각은 base64url(utf8(JSON {"n": 이름, "l": 압축 폴리라인(정밀도 5), "r": 100m마다 누적 초(선택)}))에서
     '='를 뺀 것이다(앱의 lib/state/workout_store_running.dart _encodePayload, lib/core/run/geo.dart).
     # 뒤는 브라우저가 서버로 보내지 않는다. 이 페이지도 조각을 어디에도 보내지 않고 브라우저 안에서만 푼다.
     사용 통계·광고 스크립트를 넣지 않는다. 언어는 사이트 첫 화면과 같은 규칙(저장한 fb-lang, 그다음 브라우저 언어)으로 고른다. -->
<main class="doc wrap" id="course">
  <p class="doc__meta" id="c-kicker"></p>
  <h1 id="c-title">FitBoost</h1>
  <p class="lead" id="c-lead"></p>
  <div id="c-body"></div>
  <noscript><p>FitBoost</p></noscript>
  <ul class="course__langs" id="c-langs"></ul>
</main>

<script id="course-core">
/* 순수 함수만 둔다. node로도 불러 시험한다. */
var FBCourse = (function () {
  'use strict';

  function b64urlToBytes(s) {
    if (!/^[A-Za-z0-9_-]+$/.test(s) || s.length % 4 === 1) return null;
    var b64 = s.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var bin;
    try { bin = atob(b64); } catch (e) { return null; }
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  /* 앱의 decodePolyline과 같다. 형식이 깨졌으면 null. */
  function decodePolyline(str) {
    var out = [], index = 0, lat = 0, lon = 0;
    function next() {
      var result = 0, shift = 0, b;
      for (;;) {
        if (index >= str.length) return null;
        b = str.charCodeAt(index++) - 63;
        if (b < 0 || b > 63) return null;
        result |= (b & 0x1f) << shift;
        shift += 5;
        if (b < 0x20) break;
        if (shift > 30) return null;
      }
      return (result & 1) ? ~(result >> 1) : (result >> 1);
    }
    while (index < str.length) {
      var dLat = next(), dLon = next();
      if (dLat === null || dLon === null) return null;
      lat += dLat; lon += dLon;
      var p = [lat / 1e5, lon / 1e5];
      if (Math.abs(p[0]) > 90 || Math.abs(p[1]) > 180) return null;
      out.push(p);
    }
    return out;
  }

  function haversine(a, b) {
    var R = 6371008.8, rad = Math.PI / 180;
    var dLat = (b[0] - a[0]) * rad, dLon = (b[1] - a[1]) * rad;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }

  function lengthOf(points) {
    var m = 0;
    for (var i = 1; i < points.length; i++) m += haversine(points[i - 1], points[i]);
    return m;
  }

  /* 조각을 코스로 푼다. {status: 'empty'|'broken'|'ok', course}. */
  function decode(fragment) {
    var raw = String(fragment || '').replace(/^#/, '').trim();
    if (!raw) return { status: 'empty' };
    if (raw.indexOf('%') >= 0) { try { raw = decodeURIComponent(raw); } catch (e) { return { status: 'broken' }; } }
    var bytes = b64urlToBytes(raw);
    if (!bytes) return { status: 'broken' };
    var json;
    try { json = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(bytes)); } catch (e) { return { status: 'broken' }; }
    if (!json || typeof json !== 'object' || Array.isArray(json) || typeof json.l !== 'string') return { status: 'broken' };
    var points = decodePolyline(json.l);
    if (!points || points.length < 2) return { status: 'broken' };
    var name = typeof json.n === 'string' ? json.n.trim().slice(0, 120) : '';
    var record = null;
    if (Array.isArray(json.r) && json.r.length) {
      var ok = json.r.every(function (v, i, a) {
        return typeof v === 'number' && isFinite(v) && v >= 0 && (i === 0 || v >= a[i - 1]);
      });
      if (ok) record = json.r.map(function (v) { return Math.round(v); });
    }
    return { status: 'ok', course: { name: name, points: points, meters: lengthOf(points), record: record } };
  }

  /* 100m마다 누적 초에서 1km 구간 시간들. 끝의 모자란 구간은 뺀다. */
  function kmSplits(record) {
    var out = [];
    for (var k = 1; k * 10 <= record.length; k++) {
      var end = record[k * 10 - 1], start = k === 1 ? 0 : record[(k - 1) * 10 - 1];
      out.push(end - start);
    }
    return out;
  }

  /* 화면 좌표(가로 w, 세로 h, 여백 pad)로 옮긴다. 경도는 위도에 맞춰 줄인다. */
  function project(points, w, h, pad) {
    var mid = 0;
    points.forEach(function (p) { mid += p[0]; });
    mid = mid / points.length * Math.PI / 180;
    var k = Math.cos(mid);
    var xs = points.map(function (p) { return p[1] * k; }), ys = points.map(function (p) { return -p[0]; });
    var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
    var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
    var spanX = maxX - minX || 1e-9, spanY = maxY - minY || 1e-9;
    var s = Math.min((w - 2 * pad) / spanX, (h - 2 * pad) / spanY);
    var ox = (w - spanX * s) / 2, oy = (h - spanY * s) / 2;
    return points.map(function (p, i) {
      return [+(ox + (xs[i] - minX) * s).toFixed(1), +(oy + (ys[i] - minY) * s).toFixed(1)];
    });
  }

  function clock(sec) {
    sec = Math.max(0, Math.round(sec));
    var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    var ss = (s < 10 ? '0' : '') + s;
    return h ? h + ':' + (m < 10 ? '0' : '') + m + ':' + ss : m + ':' + ss;
  }

  var api = { decode: decode, decodePolyline: decodePolyline, lengthOf: lengthOf, kmSplits: kmSplits, project: project, clock: clock };
  if (typeof module === 'object' && module.exports) module.exports = api;
  return api;
})();
</script>

  function pickLang() {
    var saved = null;
    try { saved = localStorage.getItem('fb-lang'); } catch (e) {}
    if (saved && T[saved]) return saved;
    var l = ((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase();
    if (!l || l.indexOf('ko') === 0) return 'ko';
    if (l.indexOf('ja') === 0) return 'ja';
    if (l.indexOf('zh') === 0) return /hant|tw|hk|mo/.test(l) ? 'zh-hant' : 'zh-hans';

  }

  function el(tag, attrs, text) {
    var e = document.createElement(tag);
    for (var k in attrs || {}) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  var SVG = 'http://www.w3.org/2000/svg';
  function svg(tag, attrs) {

  }

    var ap = el('a', { 'class': 'store store--apple', href: STORE.apple, rel: 'noopener noreferrer' });
    ap.appendChild(el('img', { src: 'https://toolbox.marketingtools.apple.com/api/v2/badges/download-on-the-app-store/black/' + b[0], alt: t.apple, height: '48', referrerpolicy: 'no-referrer' }));
    var gp = el('a', { 'class': 'store store--google', href: STORE.google, rel: 'noopener noreferrer' });
    gp.appendChild(el('img', { src: 'https://play.google.com/intl/en_us/badges/static/images/badges/' + b[1] + '_badge_web_generic.png', alt: t.google, height: '70', referrerpolicy: 'no-referrer' }));
    stores.appendChild(ap); stores.appendChild(gp);
    body.appendChild(stores);

    body.appendChild(el('p', { 'class': 'doc__meta', style: 'margin-top:32px' }, t.privacy));
    var help = el('p');
    help.appendChild(el('a', { href: GUIDE[lang] + 'running.html#share-course' }, t.help));
    body.appendChild(help);

    var langs = document.getElementById('c-langs');
    langs.textContent = '';
    Object.keys(T).forEach(function (code) {
      var li = el('li');
      var btn = el('button', { type: 'button', lang: HTML_LANG[code] }, NAMES[code]);
      if (code === lang) btn.setAttribute('aria-current', 'true');
      btn.addEventListener('click', function () {
        try { localStorage.setItem('fb-lang', code); } catch (e) {}
        render(code);
      });
      li.appendChild(btn);
      langs.appendChild(li);
    });
  }

  render(pickLang());
})();
</script>
