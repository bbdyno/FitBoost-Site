<!doctype html>
<!-- 공유 미리보기 그림(docs/assets/og.png)의 원본. 언어를 타지 않게 숫자와 이름만 쓴다.
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
       --window-size=1200,630 --screenshot=docs/assets/og.png src/og.html -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #EDEDE8; position: relative; font-family: -apple-system, "Helvetica Neue", sans-serif; }
  .num { position: absolute; right: 40px; bottom: 30px; font-family: Anton; font-size: 330px; line-height: .8; color: #fff; display: flex; }
  .num span { font-size: 66px; color: #0D0D0E; margin: 10px 0 0 10px; }
  .fig { position: absolute; right: 90px; bottom: 26px; width: 720px; filter: drop-shadow(0 30px 30px rgba(0,0,0,.18)); }
  .brand { position: absolute; left: 64px; top: 60px; display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 44px; letter-spacing: -1.5px; color: #0D0D0E; }
  .brand img { width: 72px; height: 72px; border-radius: 16px; }
  .tag { position: absolute; left: 64px; top: 180px; background: #C5F04A; color: #0D0D0E; border-radius: 22px; padding: 16px 22px; font-family: Anton; font-size: 64px; line-height: 1; }
  .tag small { display: block; font-family: -apple-system, sans-serif; font-size: 20px; font-weight: 700; margin-top: 6px; opacity: .7; }
</style>
</head>
<body>
  <div class="num">102.5<span>KG</span></div>
  <img class="fig" src="../docs/assets/ex/004312.webp" alt="">
  <div class="brand"><img src="../docs/assets/icon.webp" alt="">FitBoost</div>
  <div class="tag">+2.5 kg<small>NEXT SET · RIR 2</small></div>
</body>
</html>
